apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: ai-interview-platform
  annotations:
    description: AI Interview Platform deployment template for OpenShift
labels:
  app.kubernetes.io/name: ${APP_NAME}
  app.kubernetes.io/part-of: ai-interview-platform

parameters:
  - name: APP_NAME
    description: Application name used for resource naming.
    value: ai-interview-platform
  - name: APP_NAMESPACE
    description: Target OpenShift project/namespace.
    value: ai-interview-platform
  - name: APP_IMAGE
    description: Container image to deploy.
    required: true
    value: ghcr.io/agents-adityaupadhyay/ai-interview-portal:latest
  - name: REPLICAS
    description: Number of application replicas.
    value: "1"
  - name: APP_PORT
    description: Service port exposed by OpenShift.
    value: "3000"
  - name: ROUTE_HOST
    description: Optional custom route host (leave empty for auto-generated host).
    value: ""
  - name: NEXTAUTH_URL
    description: Public URL for NextAuth callbacks.
    required: true
  - name: NEXT_PUBLIC_APP_URL
    description: Public URL used by the UI.
    required: true
  - name: DATABASE_URL
    description: PostgreSQL connection string.
    required: true
  - name: NEXTAUTH_SECRET
    description: NextAuth secret.
    required: true
  - name: AI_API_KEY
    description: AI provider API key.
    required: true
  - name: DEEPGRAM_API_KEY
    description: Deepgram API key.
    required: true
  - name: SMTP_PASS
    description: SMTP password or app password.
    value: ""
  - name: AI_BASE_URL
    description: OpenAI-compatible API base URL.
    value: https://api.openai.com
  - name: AI_MODEL
    description: AI model name.
    value: gpt-4o
  - name: AGENT_CHAT
    description: Recruiter AI assistant (on/off). Needs migrations/003_agent_chat.sql.
    value: "off"
  - name: AGENT_FEATURES
    description: Assistant feature ids, comma-separated; empty for all.
    value: ""
  - name: TTS_PROVIDER
    description: TTS provider name.
    value: deepgram
  - name: EDGE_TTS_VOICE
    description: Edge TTS voice.
    value: en-IN-NeerjaNeural
  - name: EDGE_TTS_RATE
    description: Edge TTS rate.
    value: +10%
  - name: STT_PROVIDER
    description: STT provider.
    value: deepgram
  - name: STT_LANGUAGE
    description: STT language.
    value: en-IN
  - name: MAX_PROCTORING_STRIKES
    description: Max proctoring strikes.
    value: "20"
  - name: NEXT_PUBLIC_MAX_PROCTORING_STRIKES
    description: Client-visible max proctoring strikes.
    value: "20"
  - name: HEARTBEAT_STALE_MS
    description: Heartbeat stale timeout in milliseconds.
    value: "180000"
  - name: SILENCE_DELAY_MS
    description: Silence detection delay in milliseconds.
    value: "3000"
  - name: SMTP_HOST
    description: SMTP host.
    value: smtp.gmail.com
  - name: SMTP_PORT
    description: SMTP port.
    value: "587"
  - name: SMTP_USER
    description: SMTP username.
    value: ""
  - name: SMTP_FROM
    description: SMTP from address.
    value: ""
  - name: NODE_TLS_REJECT_UNAUTHORIZED
    description: TLS reject unauthorized setting (recommended 1 in production).
    value: "1"

objects:
  - apiVersion: v1
    kind: Secret
    metadata:
      name: ${APP_NAME}-secret
      namespace: ${APP_NAMESPACE}
      labels:
        app.kubernetes.io/name: ${APP_NAME}
    type: Opaque
    stringData:
      DATABASE_URL: ${DATABASE_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AI_API_KEY: ${AI_API_KEY}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
      SMTP_PASS: ${SMTP_PASS}

  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: ${APP_NAME}-config
      namespace: ${APP_NAMESPACE}
      labels:
        app.kubernetes.io/name: ${APP_NAME}
    data:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      AI_BASE_URL: ${AI_BASE_URL}
      AI_MODEL: ${AI_MODEL}
      AGENT_CHAT: ${AGENT_CHAT}
      AGENT_FEATURES: ${AGENT_FEATURES}
      TTS_PROVIDER: ${TTS_PROVIDER}
      EDGE_TTS_VOICE: ${EDGE_TTS_VOICE}
      EDGE_TTS_RATE: ${EDGE_TTS_RATE}
      STT_PROVIDER: ${STT_PROVIDER}
      STT_LANGUAGE: ${STT_LANGUAGE}
      MAX_PROCTORING_STRIKES: ${MAX_PROCTORING_STRIKES}
      NEXT_PUBLIC_MAX_PROCTORING_STRIKES: ${NEXT_PUBLIC_MAX_PROCTORING_STRIKES}
      HEARTBEAT_STALE_MS: ${HEARTBEAT_STALE_MS}
      SILENCE_DELAY_MS: ${SILENCE_DELAY_MS}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_FROM: ${SMTP_FROM}
      NODE_TLS_REJECT_UNAUTHORIZED: ${NODE_TLS_REJECT_UNAUTHORIZED}

  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ${APP_NAME}
      namespace: ${APP_NAMESPACE}
      labels:
        app.kubernetes.io/name: ${APP_NAME}
    spec:
      replicas: ${REPLICAS}
      selector:
        matchLabels:
          app.kubernetes.io/name: ${APP_NAME}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ${APP_NAME}
        spec:
          containers:
            - name: ${APP_NAME}
              image: ${APP_IMAGE}
              imagePullPolicy: IfNotPresent
              ports:
                - containerPort: 3000
                  protocol: TCP
              envFrom:
                - configMapRef:
                    name: ${APP_NAME}-config
                - secretRef:
                    name: ${APP_NAME}-secret
              readinessProbe:
                httpGet:
                  path: /api/health
                  port: 3000
                initialDelaySeconds: 15
                periodSeconds: 10
                timeoutSeconds: 3
                failureThreshold: 6
              livenessProbe:
                httpGet:
                  path: /api/health
                  port: 3000
                initialDelaySeconds: 30
                periodSeconds: 15
                timeoutSeconds: 3
                failureThreshold: 6
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              volumeMounts:
                - name: app-data
                  mountPath: /app/data
          volumes:
            - name: app-data
              emptyDir: {}

  - apiVersion: v1
    kind: Service
    metadata:
      name: ${APP_NAME}
      namespace: ${APP_NAMESPACE}
      labels:
        app.kubernetes.io/name: ${APP_NAME}
    spec:
      selector:
        app.kubernetes.io/name: ${APP_NAME}
      ports:
        - name: http
          port: ${APP_PORT}
          targetPort: 3000
          protocol: TCP

  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: ${APP_NAME}
      namespace: ${APP_NAMESPACE}
      labels:
        app.kubernetes.io/name: ${APP_NAME}
    spec:
      host: ${ROUTE_HOST}
      to:
        kind: Service
        name: ${APP_NAME}
      port:
        targetPort: http
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
